services:
  creatoros-postgres:
    image: postgres:16-alpine
    container_name: creatoros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: creatoros
      POSTGRES_PASSWORD: creatoros_dev_password
      POSTGRES_DB: creatoros
    ports:
      - "5432:5432"
    volumes:
      - creatoros_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U creatoros -d creatoros"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  creatoros_postgres_data:
