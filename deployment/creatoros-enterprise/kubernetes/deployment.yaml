apiVersion: apps/v1
kind: Deployment
metadata:
  name: creatoros-api
  namespace: creatoros
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: creatoros-api
  template:
    metadata:
      labels:
        app: creatoros-api
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: creatoros/api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: creatoros-api-config
          readinessProbe:
            httpGet:
              path: /api/v1/enterprise/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/enterprise/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
