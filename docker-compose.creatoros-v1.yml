services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: creatoros
      POSTGRES_PASSWORD: creatoros_dev_password
      POSTGRES_DB: creatoros
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatoros -d creatoros"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - creatoros_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  creatoros_postgres_data: